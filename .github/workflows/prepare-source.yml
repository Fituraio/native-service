name: Prepare native source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify public source snapshot
        run: |
          python3 - <<'PYDATA'
          import hashlib, pathlib, urllib.request, zipfile
          url = "https://github.com/Fituraio/native-service/releases/download/source-v1.3/native-service-input.zip"
          archive = pathlib.Path("/tmp/source.zip")
          with urllib.request.urlopen(url, timeout=90) as response, archive.open("wb") as target:
              while data := response.read(1048576):
                  target.write(data)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "a94a5f26986c7f0f48378ad4bf93980f072085ed65501802a5223bd0ac9bec7b"
          output = pathlib.Path("/tmp/source-tree")
          output.mkdir()
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == len(set(names)) == 50707
              total = 0
              for name in sorted(names):
                  relative = pathlib.PurePosixPath(name)
                  assert not relative.is_absolute() and ".." not in relative.parts
                  assert relative.parts[0] in {"testcases", "testcasesupport"}
                  target = output / str(relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  raw = z.read(name)
                  target.write_bytes(raw)
                  total += len(raw)
              assert total == 184664437
          print("Prepared verified native source: 50707 files; 184664437 bytes. No dataset code executed.")
          PYDATA
      - name: Publish frozen source branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          cd /tmp/source-tree
          git init --initial-branch=source
          git config user.name "Fituraio"
          git config user.email "opensource@users.noreply.github.com"
          git add .
          git commit -m "Import verified native source snapshot"
          git remote add origin "https://github.com/${TARGET_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin source
